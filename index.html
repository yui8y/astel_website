<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>星を巡る誰でもない者</title>
    <style>
        @font-face {
            font-family: 'DotGothic16';
            src: url('fonts/DotGothic16-Regular.ttf') format('truetype');
            font-display: swap; /* 読み込み中は別のフォントで先に表示する */
        }
        body { margin: 0; overflow: hidden; background: #000; }
        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            image-rendering: pixelated;/* 拡大するとき、ぼかさない */
        }
        .hud {
            position: fixed;
            left: 16px;
            bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            background: rgba(26, 22, 38, 0.8);   /* 掲示板の黒いパネル */
            border: 2px solid #3a3450;
            font-family: 'DotGothic16', monospace;
            font-size: 16px;
            color: #ffb347;                       /* 電光掲示板のオレンジ */
            text-shadow: 0 0 4px rgba(255, 170, 60, 0.8); /* ぼんやり光る */
            pointer-events: none;
        }
        .hud-time {
            padding-right: 12px;
            border-right: 2px solid #3a3450;
        }
        .hud-window {
            width: 320px;
            overflow: hidden;
            white-space: nowrap;
        }
        .hud-scroll {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
        }
        @keyframes marquee {
            from { transform: translateX(0); }
            to   { transform: translateX(-100%); }
        }
        /* 動きを減らす設定の人には、流さない */
        @media (prefers-reduced-motion: reduce) {
            .hud-scroll { animation: none; padding-left: 0; }
        }
    </style>
    <!-- 「three」という名前で、Three.jsの場所を登録する -->
    <script type="importmap">
        {
        "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="./js/main.js"></script>
</head>

<body>

</body>

</html>
